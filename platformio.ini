; Прошивка SmartHydroFeeder для ESP32 DevKit (WROOM-32U)
; Збірка: pio run          Прошивка: pio run -t upload          Монітор: pio device monitor
; Симуляція у Wokwi: pio run -e wokwi, потім у VS Code "Wokwi: Start Simulator"
; Юніт-тести на ПК: pio test -e test
;
; Середовища:
;   esp32dev        реальна плата, датчик HC-SR04 (поточний прототип)
;   esp32dev_scale  реальна плата, тензодатчик з HX711 (коли приїдуть деталі)
;   wokwi           симулятор, тензодатчик з HX711
;   wokwi_sonar     симулятор, HC-SR04 (у wokwi.toml замінити шлях на .pio/build/wokwi_sonar/...)
;   test            юніт-тести логіки (lib/) на комп'ютері, без плати

[platformio]
default_envs = esp32dev

; Спільні налаштування для ESP32
[esp32]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.13.0
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3
    bogde/HX711@^0.7.5

[env:esp32dev]
extends = esp32

[env:esp32dev_scale]
extends = esp32
build_flags = -DUSE_SCALE_SENSOR

; Wi-Fi у симуляторі підключається до мережі Wokwi-GUEST без порталу налаштування
[env:wokwi]
extends = esp32
build_flags = -DWOKWI_SIM -DUSE_SCALE_SENSOR

[env:wokwi_sonar]
extends = esp32
build_flags = -DWOKWI_SIM

; Тести збираються компілятором MinGW, який PlatformIO завантажує сам
[env:test]
platform = windows_x86
test_framework = unity
build_flags = -std=c++11
