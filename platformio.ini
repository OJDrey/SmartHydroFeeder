; Прошивка SmartHydroFeeder для ESP32 DevKit (WROOM-32U)
; Збірка: pio run          Прошивка: pio run -t upload          Монітор: pio device monitor
; Симуляція у Wokwi: pio run -e wokwi, потім у VS Code "Wokwi: Start Simulator"

[platformio]
default_envs = esp32dev

; Спільні налаштування для всіх середовищ
[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit GFX Library@^1.13.0
    tzapu/WiFiManager@^2.0.17
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.3

; Реальна плата
[env:esp32dev]

; Симулятор Wokwi: Wi-Fi підключається до мережі Wokwi-GUEST без порталу налаштування
[env:wokwi]
build_flags = -DWOKWI_SIM
